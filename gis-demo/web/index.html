<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Demo lớp dữ liệu nền ĐBSCL — Mekong Xanh</title>
  <meta name="description" content="Spike GIS-LAYERS-001: năm lớp dữ liệu nền vùng Đồng bằng sông Cửu Long. Bản demo, dữ liệu có nhãn nguồn và mốc thời gian trên màn hình." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231F4E45'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle'%3E%F0%9F%97%BA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <strong>Lớp dữ liệu nền ĐBSCL</strong>
      <span class="tag demo">BẢN DEMO · SPIKE-GIS-LAYERS-001</span>
    </div>
    <label class="picker">
      <span>Lớp hiển thị</span>
      <select id="layer-select" aria-label="Chọn lớp dữ liệu"></select>
    </label>
    <label class="opacity">
      <span>Độ trong suốt</span>
      <input id="opacity" type="range" min="10" max="100" value="75" aria-label="Độ trong suốt lớp" />
    </label>
    <label class="toggle"><input id="plots-toggle" type="checkbox" checked /> Lô mẫu <em>(minh hoạ)</em></label>
  </header>

  <div id="map" role="application" aria-label="Bản đồ Đồng bằng sông Cửu Long"></div>

  <!-- F-05 / R-03: khối nguồn LUÔN nhìn thấy khi lớp đang bật -->
  <aside id="source-box" class="source-box" aria-live="polite"></aside>

  <!-- Bảng chú giải raster / điểm -->
  <aside id="legend" class="legend" hidden></aside>

  <!-- Kết quả bấm điểm (F-03) + biểu đồ lịch sử (F-04) -->
  <section id="sheet" class="sheet" hidden>
    <div class="sheet-handle" id="sheet-close" role="button" aria-label="Đóng">Đóng ▾</div>
    <div id="sheet-body"></div>
  </section>

  <footer class="attrib" id="attrib"></footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
