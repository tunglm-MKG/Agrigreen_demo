# Cấu hình triển khai Render — https://render.com
#
# Dự án không có dependency npm nào và chạy thẳng bằng Node, nên không cần bước
# build. Chỉ cần Node đủ mới để hỗ trợ hai thứ: cơ chế type-stripping cho tệp
# .ts (Node ≥ 22.6, mặc định bật từ 23.6) và module node:sqlite.
#
# CÁCH DÙNG
#   1. Vào https://dashboard.render.com → New → Blueprint
#   2. Chọn repo tunglm-MKG/Agrigreen_demo
#   3. Render đọc tệp này và tạo dịch vụ; đặt giá trị cho DEMO_ACCESS_CODE khi
#      được hỏi (Render sinh sẵn một chuỗi ngẫu nhiên, đổi được thành mã dễ đọc).
#
# LƯU Ý VỀ DỮ LIỆU
#   Gói miễn phí không có đĩa lưu trữ bền: tệp SQLite mất mỗi lần khởi động lại.
#   Với bản trình diễn thì không sao — `seedIfEmpty()` tự nạp lại dữ liệu mẫu khi
#   khởi động, nên dịch vụ tự phục hồi. Muốn giữ dữ liệu người xem nhập vào thì
#   bỏ chú thích phần `disk` bên dưới (cần gói trả phí).
#
#   Gói miễn phí cũng ngủ sau 15 phút không có truy cập; lần truy cập kế tiếp
#   mất khoảng 30–60 giây để đánh thức. Nói trước với người xem để họ không
#   tưởng là hỏng.

services:
  - type: web
    name: agrigreen-demo
    runtime: node
    plan: free
    region: singapore
    branch: main

    # Không có dependency nào để cài; lệnh này chỉ để Render không tự đoán.
    buildCommand: 'echo "Khong co buoc build - du an chay truc tiep bang Node"'
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: '24'
      # Mã truy cập bản trình diễn.
      #
      # `sync: false` = Render HỎI bạn nhập giá trị khi tạo dịch vụ, thay vì tự
      # sinh một chuỗi ngẫu nhiên. Đây là mã mà người thật phải đọc cho nhau, nên
      # để người dùng tự chọn một mã dễ nhớ; chuỗi ngẫu nhiên 40 ký tự chỉ hợp
      # với khoá bí mật máy dùng với nhau.
      #
      # Đổi giá trị này trong tab Environment là thu hồi quyền xem của mọi người
      # đã có link.
      - key: DEMO_ACCESS_CODE
        sync: false
      # Đánh giá bảo mật 24/09/2026: production không seed tài khoản demo (C-02), không tự sinh khoá cạnh dữ liệu (M-05),
      # tin đúng một lớp proxy của Render khi đọc IP (H-04). Mật khẩu SAdmin và khoá mã hoá do Render sinh ngẫu nhiên;
      # đọc SUPER_ADMIN_PASSWORD trong tab Environment để đăng nhập lần đầu.
      - key: NODE_ENV
        value: production
      - key: TRUSTED_PROXY_HOPS
        value: '1'
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # Chỉ bật khi thật sự cần bản demo có dữ liệu mẫu trên môi trường công khai (tài khoản demo nhận mật khẩu tạm in trong log).
      # - key: SEED_DEMO_DATA
      #   value: '1'

    # Bỏ chú thích để giữ dữ liệu qua các lần khởi động lại (cần gói trả phí).
    # disk:
    #   name: agrigreen-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
