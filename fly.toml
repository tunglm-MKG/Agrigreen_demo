# Cấu hình triển khai Fly.io — https://fly.io
#
# CÁCH DÙNG
#   1. Cài flyctl: https://fly.io/docs/flyctl/install/
#   2. fly auth login
#   3. fly launch --no-deploy --copy-config      (đổi `app` bên dưới nếu trùng tên)
#   4. fly secrets set DEMO_ACCESS_CODE=ma-cua-ban
#   5. fly volumes create agrigreen_data --size 1 --region sin
#   6. fly deploy
#
# Khác Render ở chỗ có volume nên dữ liệu SQLite giữ được qua các lần khởi động.

app = "agrigreen-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Đánh giá bảo mật 24/09/2026: không seed tài khoản demo ở production (C-02); tin một lớp proxy của Fly (H-04).
  NODE_ENV = "production"
  TRUSTED_PROXY_HOPS = "1"
  # Bí mật đặt bằng: fly secrets set SUPER_ADMIN_PASSWORD=... DATA_ENCRYPTION_KEY=$(openssl rand -hex 32) DEMO_ACCESS_CODE=...
  # Muốn có dữ liệu mẫu: fly secrets set SEED_DEMO_DATA=1 (tài khoản demo nhận mật khẩu tạm in trong log lần seed).

[[mounts]]
  source = "agrigreen_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Để 0 thì máy ngủ khi không có truy cập (tiết kiệm); lần truy cập kế tiếp
  # mất vài giây để đánh thức. Đặt 1 nếu muốn phản hồi tức thì.
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
