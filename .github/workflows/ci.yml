# CI cho AgriGreen — đánh giá bảo mật 24/09/2026 (M-08): test tự động, quét bí mật, phân tích tĩnh,
# quét cấu hình container trên mỗi push/pull request. Không có bước cài dependency vì dự án không có npm package.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # codeql-action cần đọc thông tin workflow run để gửi trạng thái (lỗi "Resource not accessible by integration").
  actions: read

jobs:
  test:
    name: Kiểm thử (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm test
        env:
          SUPER_ADMIN_PASSWORD: CI-SAdmin-Chi-De-Test-2026
          DEMO_ACCOUNT_PASSWORD: '123456'
          DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: npm test

  secrets:
    name: Quét bí mật (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action v2 đòi GITLEAKS_LICENSE với repo của tổ chức; CLI gitleaks (MIT) quét được toàn bộ lịch sử mà không cần license.
      - name: gitleaks detect (toàn bộ lịch sử git)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --report-format sarif --report-path /repo/gitleaks.sarif
      # Repo chưa bật GitHub Advanced Security nên không tải SARIF lên Code scanning được → lưu làm artifact để xem.
      - name: Lưu báo cáo gitleaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  codeql:
    name: Phân tích tĩnh (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      # Không tải lên Code scanning (repo chưa bật Advanced Security); phân tích tại chỗ, ghi SARIF ra thư mục
      # và TỰ chặn khi còn cảnh báo mức error — kết quả đầy đủ nằm trong artifact codeql-sarif.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - name: Chặn khi CodeQL còn cảnh báo mức error
        run: node .github/scripts/codeql-gate.mjs codeql-results
      - name: Lưu báo cáo CodeQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results

  container:
    name: Quét Dockerfile (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
