name: Update files from external URLs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/db-logging-and-fe-cleanup
      - name: Download and commit files
        run: |
          curl -sL -o src/web/pages/straw.js "https://customer-assets-eiarnc6j.emergentagent.net/wingman/da3f7d71-faa9-437f-9631-576f64cbe8ef/attachments/d51ca9e563bf448fb316005ee55cef61_straw.js"
          curl -sL -o src/api.ts "https://customer-assets-eiarnc6j.emergentagent.net/wingman/da3f7d71-faa9-437f-9631-576f64cbe8ef/attachments/980daa8177a34c6692707ed63745932a_api.ts"
          curl -sL -o src/platform/db/schema.ts "https://customer-assets-eiarnc6j.emergentagent.net/wingman/da3f7d71-faa9-437f-9631-576f64cbe8ef/attachments/0ca47ddade55443487bf98bc1eba3baf_schema_modified.ts"
          curl -sL -o src/web/pages/erp.js "https://customer-assets-eiarnc6j.emergentagent.net/wingman/da3f7d71-faa9-437f-9631-576f64cbe8ef/attachments/ab42603e02d64c3c943258d3692e497c_erp.js"
          curl -sL -o src/web/pages/htx.js "https://customer-assets-eiarnc6j.emergentagent.net/wingman/da3f7d71-faa9-437f-9631-576f64cbe8ef/attachments/84acc73d559c4e58ba61dcb0858863f4_htx_modified.js"
          git config user.name "emergent-agent-e1"
          git config user.email "github@emergent.sh"
          git add -A
          git diff --staged --stat
          git commit -m "feat: update remaining 5 files — server summary fallback, audit triggers, prompt dialog" || echo "No changes to commit"
          git push